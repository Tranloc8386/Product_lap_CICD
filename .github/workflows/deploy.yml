name: CI Build Spring Boot App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Copy Jar
    runs-on: self-hosted
    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure mvnw executable
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw -B clean package -DskipTests

      - name: List built artifacts
        run: ls -lh target

      - name: Copy jar to run directory
        run: |
          cp target/*.jar /home/ubuntu/product_project/product_source/product-management.jar


  deploy:
    name: Deploy Project
    runs-on: self-hosted
    needs: build
    steps:
      - name: Restart product-app service
        run: |
          sudo systemctl daemon-reload
          sudo systemctl restart product-app
          sudo systemctl status product-app --no-pager